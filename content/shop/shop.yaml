# Bâtiments et améliorations de la ville (lot L6, D-19). Format : packages/engine/src/town.ts (validateShop).
# price : euros du jeu ; joy : points de bonheur gagnés pour toujours (bonheur de départ 40, maximum 100) ;
# bonus : euros versés à la fin de chaque journée, en entier avec 3 étoiles (D-21) ; réglage du lot L7.2 (D-22) : prix
# ≈ 12 à 20 journées de bonus, la ville se complète en une vingtaine de journées (docs/EQUILIBRAGE.md) ;
# discovery : ordre de la phase découverte (un seul objet proposé à la fois) ; unlockAt : nombre de bâtiments achetés
# pour l'ouvrir ensuite ; opensHeat : ouvre les journées avec chaleur.
# Lot L10.2 (R2-09, D-30) : les bâtiments qui aident (baissent ou lissent la demande, protègent des événements) coûtent
# 30 % de plus, bonus inchangé : maison médicale, batterie, parc, isolation, solaire, hôpital, cuve.
# effects : ajout à la demande, en % du cœur, à un moment de la journée (jour 9–17 h, soir 19–21 h, nuit 23–5 h,
# toujours), avec rampes de 2 h ; days : journées concernées (toutes si absent). Le moteur garde élec + chaleur ≤ 100 %.
# Événements (lot L7.1) : protects : son quartier n'est jamais coupé ; softens : les pannes sont moins fortes (0,8) ;
# heatwaveCap : limite du cœur pendant une canicule (90 au lieu de 80).
# Textes : shop.<id> (nom) et shop.where.<id> (effet) dans content/i18n/fr.yaml ; shop.discover.<id> dans les répliques.
items:
  # Phase découverte (D-19 E4), dans l'ordre. Lot L9.3 : le réseau de chaleur en premier, à 900 € (cadeau de bienvenue
  # s'il manque des euros après la première journée), pour jouer le printemps dès la 2e journée.
  - { id: reseau-chaleur, price: 900, joy: 3, bonus: 60, discovery: 1, opensHeat: true, effects: [{ out: heat, add: 1, when: toujours }] }
  - { id: ferme, price: 2700, joy: 3, bonus: 200, discovery: 2, effects: [{ out: elec, add: 2, when: jour }] }
  - { id: maison-lilas, price: 2400, joy: 3, bonus: 200, discovery: 3, effects: [{ out: elec, add: 1, when: soir }, { out: heat, add: 1, when: toujours }] }
  - { id: maison-ve, price: 3000, joy: 3, bonus: 200, discovery: 4, effects: [{ out: elec, add: 2, when: nuit }] }
  - { id: epicerie, price: 3000, joy: 3, bonus: 200, discovery: 5, effects: [{ out: elec, add: 1, when: toujours }] }
  - { id: ecole, price: 4500, joy: 5, bonus: 350, discovery: 6, effects: [{ out: elec, add: 2, when: jour, days: [printemps, hiver] }] }
  - { id: usine-cereales, price: 6000, joy: 3, bonus: 450, discovery: 7, effects: [{ out: heat, add: 2, when: toujours }] }
  - { id: maison-medicale, price: 5900, joy: 4, bonus: 350, discovery: 8, softens: 0.8, effects: [{ out: elec, add: 1, when: jour }] }
  # Phase libre : s'ouvre avec la taille de la ville.
  - { id: batterie, price: 11700, joy: 3, bonus: 500, unlockAt: 8, heatwaveCap: 90, effects: [{ out: elec, add: -2, when: soir }, { out: elec, add: 2, when: nuit }] }
  - { id: parc, price: 6200, joy: 5, bonus: 250, unlockAt: 8, effects: [{ out: elec, add: -1, when: jour, days: [ete] }] }
  - { id: fontaine, price: 3000, joy: 4, bonus: 150, unlockAt: 8 }
  - { id: piste, price: 6000, joy: 4, bonus: 350, unlockAt: 10 }
  - { id: piscine, price: 7200, joy: 5, bonus: 400, unlockAt: 10, effects: [{ out: heat, add: 2, when: toujours }] }
  - { id: eclairage, price: 7200, joy: 3, bonus: 400, unlockAt: 10, effects: [{ out: elec, add: 1, when: soir }] }
  - { id: isolation, price: 11700, joy: 3, bonus: 500, unlockAt: 12, effects: [{ out: heat, add: -2, when: toujours, days: [hiver] }, { out: heat, add: -1, when: toujours, days: [printemps] }] }
  - { id: solaire, price: 14000, joy: 3, bonus: 600, unlockAt: 12, effects: [{ out: elec, add: -3, when: jour, days: [ete] }, { out: elec, add: -1, when: jour, days: [printemps, hiver] }] }
  - { id: hopital, price: 15600, joy: 4, bonus: 650, unlockAt: 14, protects: true, effects: [{ out: elec, add: 2, when: toujours }] }
  - { id: cuve, price: 15600, joy: 3, bonus: 650, unlockAt: 16, effects: [{ out: heat, add: -2, when: soir }, { out: heat, add: 2, when: nuit }] }
  # Lot L10.6 (R2-06, D-34) : la ville s'agrandit. Ces six bâtiments s'ouvrent quand les 18 premiers sont achetés.
  # repeat : achetable plusieurs fois, chaque exemplaire 15 % plus cher que le précédent et posé sur son propre terrain
  # (deux couleurs en alternance) ; party : la fête de la ville est tirée 3 fois plus souvent ; repair : les réparations
  # prennent la moitié du temps.
  - { id: petite-maison, price: 2600, joy: 2, bonus: 150, unlockAt: 18, repeat: true, effects: [{ out: elec, add: 1, when: soir }, { out: heat, add: 1, when: toujours }] }
  - { id: immeuble-neuf, price: 5200, joy: 3, bonus: 300, unlockAt: 18, repeat: true, effects: [{ out: elec, add: 2, when: soir }, { out: heat, add: 1, when: toujours }] }
  - { id: patisserie, price: 6800, joy: 4, bonus: 400, unlockAt: 18, effects: [{ out: heat, add: 2, when: jour }] }
  - { id: hotel, price: 11200, joy: 4, bonus: 700, unlockAt: 18, effects: [{ out: elec, add: 2, when: toujours }] }
  - { id: mairie, price: 10600, joy: 5, bonus: 500, unlockAt: 18, party: 3 }
  - { id: caserne, price: 11400, joy: 4, bonus: 550, unlockAt: 18, repair: 0.5, effects: [{ out: elec, add: 1, when: toujours }] }

# Lot L10.6b3 (R2-07) : les trois quartiers à vendre, au-delà de la nouvelle rue. Un quartier n'est pas un bâtiment :
# il n'apporte ni bonheur ni bonus, il ouvre 6 terrains de plus. Les trois sont pareils, donc le prix ne tient pas au
# quartier choisi mais au rang de l'achat : 2, 3 puis 5 journées de bonus d'une ville complète (9 810 € par journée à
# 3 étoiles, docs/EQUILIBRAGE.md). À confirmer avec l'outil d'équilibrage (lot L10.6c).
# unlockAt : les quartiers s'ouvrent quand la ville compte 24 bâtiments, soit 6 terrains encore libres sur les 30.
quarters:
  prices: [20000, 30000, 50000]
  unlockAt: 24
