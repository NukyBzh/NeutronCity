# Répliques de Cassandra (français). L'identifiant servira de nom au fichier de voix (plus tard).
# Règles : tutoiement, ≤ 15 mots si possible, un seul mot nouveau, écrit en gras avec **mot**.
accueil.bonjour: "Salut ! Moi, c'est Cassandra. Viens piloter la **centrale** avec moi !"

# Tutoriel de la première partie (lot L5) : le temps est arrêté, une chose à la fois.
tuto.ville: "Voici ta ville. Pour vivre, elle a besoin de ta **centrale** !"
tuto.demande: "La ligne en pointillés, c'est la **demande** : ce que la ville veut."
tuto.curseur: "À toi ! Fais glisser le **curseur** jaune vers le haut."
tuto.centrale: "La centrale suit **doucement**. Bouge le curseur un peu en avance !"
tuto.tirelire: "Reste près de la demande : ta **tirelire** se remplit. C'est parti !"

# Début des journées (heures fixées dans content/days/*.yaml).
jeu.ete.bonjour: "Bonjour ! Suis la ligne en pointillés : c'est la **demande** de la ville."
jeu.printemps.bonjour: "Ce matin, il fait encore frais : la ville veut un peu de **chaleur**."
jeu.hiver.bonjour: "Brrr, il fait froid ! La ville veut de la lumière ET du chauffage."
jeu.curseurs: "Monte ou baisse les curseurs. La centrale suit doucement, alors prends de l'avance !"
jeu.ete.clim: "Il fait chaud : les **climatiseurs** démarrent. L'électricité va monter."
jeu.ete.soir: "Tout le monde rentre et cuisine : petit pic ce soir !"
jeu.chauffage.baisse: "Le soleil chauffe les maisons : il faut moins de chaleur."
jeu.hiver.coeur: "Le **cœur** se partage : plus de chaleur, c'est moins d'électricité possible."
jeu.soir: "Ce soir, tout le monde rentre. La demande va monter !"
jeu.fin.proche: "La ville va se coucher. Encore un effort jusqu'à minuit !"

# Événements (lot L7.1, packages/engine/src/surprises.ts) : surprise.<id> est dit une heure avant pour les événements
# annoncés, au début pour les autres ; .why la première fois qu'il arrive (phrase pour comprendre) ; .done quand
# l'enfant a agi ou gagné.
surprise.peak: "Dans une heure, un grand match à la télé : plus d'électricité !"
surprise.peak.why: "Tout le monde allume la télé en même temps : la demande monte d'un coup !"
surprise.coldWave: "Une vague de froid arrive dans une heure : plus de chaleur !"
surprise.coldWave.why: "Quand il fait très froid, les maisons veulent plus de **chaleur**."
surprise.mildSpell: "Dans une heure, il fera plus doux : moins de chaleur."
surprise.mildSpell.why: "Quand il fait doux, les maisons ont besoin de moins de chauffage."
surprise.heatwave: "Canicule dans une heure : la centrale devra produire moins !"
surprise.heatwave.why: "La centrale se refroidit avec la rivière. Trop chaude, elle produit moins pour protéger les poissons."
surprise.storm: "Une tempête arrive dans une heure : une ligne électrique pourrait tomber !"
surprise.storm.why: "Les lignes portent le courant aux maisons. Si une ligne tombe, le quartier s'éteint."
surprise.storm.done: "Le camion de réparation est parti ! Le quartier sera rallumé bientôt."
surprise.squirrel: "Oh ! Un écureuil dans le transformateur : un quartier est dans le noir !"
surprise.squirrel.why: "Le transformateur prépare l'électricité des maisons. Un petit animal peut tout couper !"
surprise.squirrel.done: "L'écureuil est reparti, tout content. On rallume le quartier !"
surprise.heatLeak: "Une fuite sur le réseau de chaleur ! Ferme vite la vanne."
surprise.heatLeak.why: "La chaleur de la centrale voyage dans des tuyaux d'eau chaude jusqu'aux maisons."
surprise.heatLeak.done: "Vanne fermée ! L'équipe répare le tuyau."
surprise.scale: "L'échangeur est plein de calcaire : la chaleur passe mal. Nettoie-le !"
surprise.scale.why: "Comme dans une bouilloire, le calcaire empêche la chaleur de bien passer. Il faut nettoyer !"
surprise.scale.done: "Tout propre ! La chaleur passe de nouveau bien."
surprise.newcomers: "Une famille arrive en ville ! Touche-la pour l'accueillir."
surprise.newcomers.why: "Plus d'habitants, c'est plus d'électricité… et plus d'euros pour la ville."
surprise.newcomers.done: "Bienvenue ! La ville t'offre **150 €**."
surprise.classVisit: "Dans une heure, une classe visite la centrale : montre-lui ton savoir-faire !"
surprise.classVisit.why: "Reste bien sur les pointillés une heure : les élèves verront ton savoir-faire !"
surprise.classVisit.done: "Les élèves applaudissent ! Tu gagnes **100 €**."
surprise.party: "Ce soir, c'est la fête de la ville ! Les euros comptent double."
surprise.party.why: "Jour de fête : la ville consomme plus. Suis bien la courbe, tu gagnes double !"

# Pendant la partie.
jeu.coeur.plein: "Le cœur est plein ! Baisse la chaleur pour monter l'électricité."
jeu.bravo: "Bravo, tu suis parfaitement la ville !"
jeu.indice.elec.monter: "La ville manque d'électricité. Monte le curseur jaune !"
jeu.indice.elec.baisser: "Trop d'électricité ! Baisse un peu le curseur jaune."
jeu.indice.heat.monter: "Les habitants ont froid. Monte le curseur orange !"
jeu.indice.heat.baisser: "Trop de chaleur ! Baisse un peu le curseur orange."
jeu.surplus: "L'électricité en **trop** est perdue et te coûte des euros. Baisse le curseur jaune !"

# Boutique, phase découverte (lot L6) : Cassandra présente le bâtiment proposé.
shop.discover.ferme: "Une **ferme** pour nourrir la ville ! Elle rapporte des euros chaque jour."
shop.discover.reseau-chaleur: "Le **réseau de chaleur** chauffe les maisons. Il ouvre le printemps et l'hiver !"
shop.discover.maison-lilas: "De nouveaux **habitants** ! Ils allument la lumière le soir."
shop.discover.maison-ve: "Cette voiture **électrique** se recharge la nuit."
shop.discover.epicerie: "L'épicerie garde tout au **frais**, jour et nuit."
shop.discover.ecole: "Une école ! Les **élèves** y vont tous les jours, sauf l'été."
shop.discover.usine-cereales: "L'usine **sèche** les céréales avec la chaleur de ta centrale."
shop.discover.maison-medicale: "Des **médecins** pour soigner les habitants. Dernière découverte !"
shop.say.free: "Bravo, la ville grandit ! Choisis ce que tu veux construire."
shop.say.wait: "Encore quelques euros ! Joue une journée pour remplir ta tirelire."
# Lot L9.4 : l'enfant choisit où construire.
shop.place: "Où veux-tu le construire ? Touche un **terrain qui brille** dans la ville."

# Bilan : un seul conseil, choisi par le moteur (dayResult).
bilan.bravo: "Génial ! Ta ville a eu juste ce qu'il fallait toute la journée."
bilan.soir: "Le soir, la demande monte vite : monte les curseurs avant 18 h."
bilan.chaleur: "Pense aussi au curseur orange : les habitants ont eu froid."
bilan.surplus: "Tu as produit trop d'électricité : elle est **perdue** et coûte des euros."
bilan.anticiper: "Regarde les pointillés : ils te montrent la demande à venir."
